[project]
name = "eval-awareness-scaling"
version = "0.1.0"
description = "Replication of 'Verbalized Eval Awareness Inflates Measured Safety' (Qwen3 scaling results) on Fortress"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.32.0",
    "matplotlib>=3.11.2",
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
    "openai>=3.19.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "torch==2.13.0; sys_platform == 'linux'",
    "torchaudio==2.11.0; sys_platform == 'linux'",
    "torchcodec==0.16.0; sys_platform == 'linux'",
    "torchvision==0.28.0; sys_platform == 'linux'",
    "vllm==0.30.0; sys_platform == 'linux'",
]

# PyPI's torch/vLLM wheels are built for CUDA 13 (driver >= 580). The GPU box has driver 550
# (CUDA 12.4), so use the CUDA 12.9 builds, which run on it via CUDA 12 minor-version compat.
[tool.uv.sources]
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.30.0/vllm-0.30.0+cu129-cp38-abi3-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux'" }
torch = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }
torchcodec = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_awareness"]
